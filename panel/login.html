<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/svg+xml" href="/core/brand/logo.svg">
<title>meowmarism PROFESSIONAL - login</title>
<link rel="stylesheet" href="/core/tokens/tokens.css">
<link rel="stylesheet" href="/core/ui/login.css">
<script src="/i18n.js"></script>
</head>
<body>
<div class="http-warn" id="httpWarn" style="max-width:340px;margin:16px auto 0">This panel is reached over plain HTTP on a public address, so passwords and sessions can be intercepted. Put it behind HTTPS (see the README).</div>
<div class="card">
  <h1><span class="wordmark">meowmarism</span> <span class="edition">PRO</span></h1>
  <form id="loginForm">
    <div class="field"><label for="username">Username</label><input id="username" autocomplete="username" required></div>
    <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
    <button type="submit">Log in</button>
  </form>
  <div class="error" id="error"></div>
  <p style="text-align:center;margin:14px 0 0"><a href="#" data-lang-toggle data-no-i18n style="color:var(--muted);font-size:12px;text-decoration:none"><span data-lang-label></span></a></p>
</div>
<script>
(function () {
  const h = location.hostname;
  const local = /^(localhost|127\.|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.|169\.254\.|\[?::1\]?$|\[?f[cd])/i.test(h) || h.endsWith('.local') || h.endsWith('.lan') || !h.includes('.');
  if (location.protocol === 'http:' && !local) document.getElementById('httpWarn').style.display = 'block';
})();
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('error');
  errEl.style.display = 'none';
  const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: document.getElementById('username').value, password: document.getElementById('password').value }) });
  if (r.ok) { location.reload(); return; }
  const d = await r.json().catch(() => ({}));
  errEl.textContent = window.t(d.error || 'Login failed');
  errEl.style.display = 'block';
});
</script>
</body>
</html>
