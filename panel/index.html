<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>meowmarism PROFESSIONAL</title>
<link rel="icon" type="image/svg+xml" href="/core/brand/logo.svg">
<script src="/i18n.js"></script>
<link rel="stylesheet" href="/core/tokens/tokens.css">
<link rel="stylesheet" href="/core/ui/base.css">
<link rel="stylesheet" href="/core/ui/sidebar.css">
<link rel="stylesheet" href="/core/ui/users-ui.css">
<style>
.hidden{display:none!important}
.input{width:100%}
label.f{display:block;margin:0 0 12px}
label.f span{display:block;margin-bottom:4px;color:var(--muted);font-size:13px}
.top{display:flex;align-items:center;gap:14px;margin-bottom:6px;flex-wrap:wrap}
.top .sp{flex:1}
.banner{border:1px solid var(--yellow);background:rgba(212,168,79,.1);border-radius:var(--radius);padding:10px 14px;margin-bottom:16px}
.empty{padding:34px;text-align:center;color:var(--muted)}
.tabs{display:flex;gap:4px;margin:16px 0 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px;color:var(--muted);cursor:pointer;font:inherit;font-size:12.5px}
.tabs button:hover{color:var(--text)}
.tabs button.on{color:var(--text);border-color:var(--accent)}
#console{background:#0c0e12;border:1px solid var(--line);border-radius:6px;height:52vh;overflow:auto;padding:10px 12px;font:11.5px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;color:#b7bec9;white-space:pre-wrap;word-break:break-all}
.cmd{display:flex;gap:8px;margin-top:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.stat{padding:12px 14px;margin-bottom:0}.stat b{display:block;font-size:20px;font-weight:650}.stat span{color:var(--muted);font-size:12px}
.settings-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.settings-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.settings-status{color:var(--muted);font-size:12.5px}
.card-head{padding:14px 16px 0}
.card-body{padding:14px 16px}
.compact-input,.compact-select{height:32px}
.table-wrap{overflow-x:auto}
.data-table tbody tr:hover{background:rgba(255,255,255,.03)}
.tag{display:inline-block;padding:1px 8px;border:1px solid var(--line2);border-radius:999px;font-size:11px;color:var(--muted)}
.sub-tabs{display:flex;gap:6px;margin-bottom:14px}
.empty-state{padding:28px;text-align:center;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.span-12{grid-column:span 12}
.modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.modal h2{margin:0 0 10px;font-size:14.5px;font-weight:650}
#filesBreadcrumb a{color:var(--accent);text-decoration:none}
.mr-md a{color:var(--accent)}
.toast{position:fixed;right:20px;bottom:20px;background:var(--panel2);border:1px solid var(--line2);border-radius:var(--radius);padding:10px 16px;z-index:60}
.side-item.on{color:var(--text);background:rgba(255,111,196,.1);box-shadow:inset 2px 0 0 var(--accent)}
@media(max-width:760px){.main{margin-left:0}.sidebar{display:none}}
</style>
</style>
</head>
<body>


<div class="main" id="app">
<div class="wrap">
    <div id="dockerBanner" class="banner hidden"></div>

    <section class="page active" id="page-server">
    <section id="listView">
      <div class="topbar">
        <div>
          <h1><span class="wordmark">meowmarism</span> <span class="edition">PRO</span></h1>
          <p class="sub">Every instance runs in its own Docker container with hard CPU and memory limits.</p>
        </div>
        <button class="addbtn" id="newBtn" title="New instance" aria-label="New instance">+</button>
      </div>
      <div class="inst-summary" id="instSummary"></div>
      <div class="inst-grid" id="instGrid"></div>
    </section>

    </section>

    <section class="page" id="page-users"><div id="usersRoot"></div></section>
</div>
</div>

<script src="/core/ui/loaders.js"></script>
<script src="/core/ui/instances-ui.js"></script>
<script src="/core/ui/shell.js"></script>
<script src="/core/ui/users-ui.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const tr = window.t;
let system = null, current = null, listTimer = null, logTimer = null;

function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3500); }
function modal(title, bodyHtml, buttons) {
  return new Promise((resolve) => {
    const m = document.createElement('div'); m.className = 'modal-back open';
    m.innerHTML = `<div class="modal"><h2></h2><div class="mb"></div><div class="row"></div></div>`;
    m.querySelector('h2').textContent = title;
    if (typeof bodyHtml === 'string') m.querySelector('.mb').innerHTML = bodyHtml; else m.querySelector('.mb').appendChild(bodyHtml);
    const done = (v) => { m.remove(); resolve(v); };
    for (const b of buttons) {
      const el = document.createElement('button'); el.className = 'btn' + (b.primary ? ' primary' : '') + (b.danger ? ' danger' : ''); el.textContent = b.label;
      el.onclick = () => done(b.value === undefined ? true : (typeof b.value === 'function' ? b.value(m) : b.value));
      m.querySelector('.row').appendChild(el);
    }
    m.addEventListener('click', (e) => { if (e.target === m) done(null); });
    document.body.appendChild(m);
    const first = m.querySelector('input'); if (first) first.focus();
  });
}
const confirmBox = (title, text, label) => {
  const p = document.createElement('p'); p.className = 'hint'; p.style.margin = '0'; p.textContent = text;
  return modal(title, p, [{ label: 'Cancel', value: false }, { label, value: true, primary: true }]);
};

async function api(path, opts = {}) {
  const r = await fetch(path, { method: opts.method || 'GET', headers: opts.body ? { 'Content-Type': 'application/json' } : undefined, body: opts.body ? JSON.stringify(opts.body) : undefined });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401 && path !== '/api/login') { showLogin(); throw new Error('signed out'); }
  if (!r.ok) throw new Error(data.error || 'request failed');
  return data;
}

const SHELL = MeowShell.mount({
  edition: 'PRO',
  repo: 'meowmarism-official/meowmarism-professional',
  serverLabel: 'Instances',
  updateHint: 'Updating installs the newest release and restarts the panel. Your servers keep running in their containers.',
  urls: { version: '/api/version', update: '/api/update', updateStatus: '/api/update-status', settings: '/api/panel-settings' },
  t: tr, esc,
  confirm: (title, message, label) => confirmBox(title, message, label),
  pagesEl: document.querySelector('.wrap'),
  onLogout: async () => { await api('/api/logout', { method: 'POST' }).catch(() => {}); showLogin(); },
  onPage: (page) => {
    clearInterval(listTimer); clearInterval(logTimer);
    if (page === 'server') showList();
    if (page === 'users') { current = null; USERS.load(); }
  },
});

function showLogin() { clearInterval(listTimer); clearInterval(logTimer); location.href = '/'; }
async function boot() {
  try { system = await api('/api/system'); } catch (_) { return showLogin(); }
  if (!system.docker.ok) { $('dockerBanner').textContent = 'Docker is not reachable: ' + system.docker.error; $('dockerBanner').classList.remove('hidden'); }
  $('newBtn').classList.toggle('hidden', !system.panel.create);
  SHELL.setAccount({ username: system.user, role: system.role, loggedIn: true }, system.panel);
  SHELL.showPage('server');
}


function stateOf(i) {
  if (i.state === 'running') return i.health === 'healthy' ? ['on', 'Running'] : ['mid', 'Starting'];
  if (i.state === 'missing') return ['err', 'Container missing'];
  if (i.state === 'created' || i.state === 'exited') return ['', 'Stopped'];
  return ['mid', i.state];
}
function instCard(i) {
  const [cls, label] = stateOf(i);
  const running = i.state === 'running';
  const used = i.memUsage ? i.memUsage.split('/')[0] : '';
  const memMB = used ? parseFloat(used) * (/GiB/i.test(used) ? 1024 : /KiB/i.test(used) ? 1 / 1024 : 1) : null;
  return {
    name: i.name, loader: i.type.toLowerCase(), mcVersion: i.version, port: i.port, running,
    pill: { dot: cls || 'off', label: label }, cpuPercent: i.cpuUsage, rssMB: memMB,
    canOpen: true, canManage: i.caps.includes('power'), openAttr: `href="/instance/${esc(i.id)}/overview"`, id: i.id,
  };
}
async function loadList() {
  const list = await api('/api/instances?stats=1');
  MeowInstances.render($('instGrid'), $('instSummary'), list.map(instCard), system.hostMemMB, tr('No instances yet - create your first server with the + button.'));
  return list;
}
function showList() {
  clearInterval(logTimer); current = null;
  loadList().catch(() => {}); clearInterval(listTimer); listTimer = setInterval(() => loadList().catch(() => {}), 5000);
}
document.addEventListener('click', async (e) => {
  const act = e.target.closest('#instGrid [data-act]');
  if (!act) return;
  const inst = (await api('/api/instances')).find((x) => x.name === act.dataset.id);
  if (!inst) return;
  if (act.dataset.act === 'stop' && !(await confirmBox('Stop this server?', 'Players will be disconnected and the world is saved.', 'Stop'))) return;
  if (act.dataset.act === 'restart' && !(await confirmBox('Restart this server?', 'Players will be disconnected while it restarts.', 'Restart'))) return;
  act.disabled = true;
  try { await api(`/api/instances/${inst.id}/${act.dataset.act}`, { method: 'POST' }); } catch (err) { toast(err.message); }
  setTimeout(() => loadList().catch(() => {}), 800);
});
$('newBtn').onclick = async () => {
  const box = document.createElement('div');
  box.innerHTML = `<label class="f"><span>Name</span><input class="input" id="nName" placeholder="survival"></label>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label class="f"><span>Server</span><select class="input" id="nType">${system.types.map((t) => `<option>${t}</option>`).join('')}</select></label>
    <label class="f"><span>Version</span><input class="input" id="nVer" value="1.21.1"></label>
    <label class="f"><span>Memory (MB)</span><input class="input" id="nMem" type="number" value="2048" min="512" step="256"></label>
    <label class="f"><span>CPUs</span><input class="input" id="nCpu" type="number" value="2" min="0.25" step="0.25"></label></div>
    <label class="f"><span>Port</span><input class="input" id="nPort" type="number" value="25565"></label><p class="hint" id="nErr" style="color:var(--red)"></p>`;
  const spec = await modal('New instance', box, [{ label: 'Cancel', value: null }, { label: 'Create', primary: true, value: () => ({ name: $('nName').value, type: $('nType').value, version: $('nVer').value, memoryMB: Number($('nMem').value), cpus: Number($('nCpu').value), port: Number($('nPort').value) }) }]);
  if (!spec) return;
  toast('Creating, the first start downloads the image...');
  try { await api('/api/instances', { method: 'POST', body: spec }); toast('Instance created'); loadList(); } catch (err) { toast(err.message); }
};

// --- users ---
const USERS = MeowUsers.mount({
  el: $('usersRoot'),
  base: '/api/users',
  instances: async () => (await api('/api/instances')).map((i) => i.name),
  role: () => system.role,
  t: tr, esc, toast,
  confirm: (title, message, label) => confirmBox(title, message, label),
});


boot();
</script>
</body>
</html>
