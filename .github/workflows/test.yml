name: Tests
on:
  push:
    branches: [master]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Core at the locked commit is intact and green
        run: |
          commit=$(node -p "require('./core.lock').commit")
          git clone --quiet https://github.com/meowmarism-official/meowmarism-core /tmp/core
          git -C /tmp/core checkout --quiet "$commit"
          for dir in modules ui lang tokens brand; do diff -r "/tmp/core/$dir" "panel/core/$dir"; done
          (cd /tmp/core && node --test)
      - run: node --test
